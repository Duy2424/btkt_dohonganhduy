# Cấu hình phân tích tĩnh cho app Flutter ConAn.
# Loại trừ Web API (Node.js) và script deploy khỏi `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - webapi_dohonganhduy/**
    - deploy/**

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
